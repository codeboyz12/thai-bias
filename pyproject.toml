[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "thai_bias"
version         = "0.1.0"
description     = "Thai gender bias detection in multilingual embeddings (SEAT)"
readme          = "README.md"
requires-python = ">=3.10"
license         = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "sentence-transformers>=2.7",
    "torch>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["thai_bias*"]
